name: Deploy to GitHub Pages

# 仅在你想改用 GitHub Actions 部署时启用：
#   Settings → Pages → Source 选择 "GitHub Actions"
# 如果用的是 "Deploy from a branch"，这个工作流可以删掉，不删也不会影响站点。

on:
  # 仅手动触发：站点当前用 Settings → Pages 的 "Deploy from a branch" 模式发布。
  # 若以后改用 "GitHub Actions" 模式发布，把下面改成:
  #   push:
  #     branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
